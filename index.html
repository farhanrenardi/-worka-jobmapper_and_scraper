<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worka — Documentation</title>
    <meta name="description" content="Comprehensive documentation for Worka, an automated multi-source job scraping and AI classification tool for the Indonesian job market.">
    <meta name="author" content="Worka">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Styles -->
    <link rel="stylesheet" href="css/docs.css">

    <!-- Favicon (inline SVG data URI) -->

</head>
<body>
    <div id="docs-app">
        <!-- Mobile menu button -->
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle navigation"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
        <div class="mobile-overlay" id="mobile-overlay"></div>

        <!-- Sidebar -->
        <aside class="docs-sidebar">
            <div class="sidebar-header">
                <a class="sidebar-brand" data-page="overview">
                    <div>
                        <div class="brand-logo"><span class="wr">Wor</span><span class="ka">ka</span></div>
                        <div class="brand-subtitle">Documentation</div>
                    </div>
                </a>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Getting Started</div>
                    <a class="nav-link active" data-page="overview">
                        <i data-lucide="clipboard-list" class="nav-icon"></i>
                        <span>Overview</span>
                    </a>
                    <a class="nav-link" data-page="architecture">
                        <i data-lucide="blocks" class="nav-icon"></i>
                        <span>Architecture</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Deep Dive</div>
                    <a class="nav-link" data-page="scraping">
                        <i data-lucide="search" class="nav-icon"></i>
                        <span>Scraping Engine</span>

                    <a class="nav-link" data-page="ai-pipeline">

                    </a>

                <div class="nav-section">

                        <i data-lucide="zap" class="nav-icon"></i>
                        <span>Manual vs Worka</span>

                    <a class="nav-link" data-page="demo">
                        <i data-lucide="bar-chart-2" class="nav-icon"></i>
                        <span>Interactive Demo</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Reference</div>
                    <a class="nav-link" data-page="tech-stack">
                        <i data-lucide="settings" class="nav-icon"></i>
                        <span>Technology Stack</span>
                    </a>
                </div>
            </nav>

        </aside>

        <!-- Main Content -->
        <main class="docs-content">
            <div class="docs-content-inner" id="docs-content-inner">
                <!-- Content rendered by SPA router -->
            </div>

    <!-- Page scripts (order matters: charts/components first, then pages, then router) -->
    <script src="js/components/charts.js"></script>
    <script src="js/components/diagrams.js"></script>
    <script src="js/pages/overview.js"></script>
    <script src="js/pages/architecture.js"></script>
    <script src="js/pages/scraping.js"></script>
    <script src="js/pages/ai-pipeline.js"></script>
    <script src="js/pages/comparison.js"></script>
    <script src="js/pages/demo.js"></script>
    <script src="js/pages/tech-stack.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/app.js"></script>
